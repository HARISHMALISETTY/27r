<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./script1.js" defer></script>
    <script type="module" src="./script2.js" defer></script>
</head>
<body>
<h1 id="h11">head1</h1>
<h1 id="h22">head2</h1>

<button id="btn-red">click me for red</button>
<button id="btn-green">click me for green</button>
<script>

    let button1=document.getElementById("btn-red");
    let button2=document.getElementById("btn-green");
    let head1=document.getElementById("h11");

    button1.addEventListener("click",()=>{
        
        head1.style.backgroundColor="red"
    })
    button2.addEventListener("click",()=>{
        head1.style.backgroundColor="green"
    })


</script>

    
</body>
</html>

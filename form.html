<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="form">
      <input type="text" /> <br /><br />
      <input type="text" />
      <input type="submit" />
    </form>
    <script>
      let form = document.getElementById("form");
      form.addEventListener("submit", (x) => {
        x.preventDefault();
        console.log(x.target[0].value, x.target[1].value);
        let name = x.target[0].value;
        let email = x.target[1].value;
        let userDetails = { username: name, email: email };
        localStorage.setItem("userinfo", JSON.stringify(userDetails));
        let existingData = localStorage.getItem("userinfo");
        let parsedData = JSON.parse(existingData);
        console.log(parsedData);
        let card = document.createElement("div");
         card.style.backgroundColor="red"
        let username = document.createElement("h1");
        let useremail = document.createElement("p");
        username.innerHTML = parsedData.username;
        useremail.innerHTML = parsedData.email;
        card.append(username, useremail);
        document.body.append(card);       
      });
    </script>
  </body>
</html>

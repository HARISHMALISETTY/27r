<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button onclick="changeText()">click me</button>
  <button onclick="addContent()">add content</button>
  <button onclick="removeContent()">remove child</button>

  <div id="div1" style="background-color: red;height: 150px;padding: 45px;">
      <h1 id="head1">hello</h1>
      <p id="p1">iam paragraph</p>

  </div>

  <script>

    let x=document.getElementById("head1")
    // console.log(x.innerHTML);
    x.innerHTML="somesh";
    x.style.backgroundColor="orange";
    let div=document.getElementById("div1");

    function removeContent(){
      // div.removeChild(x); this will removes child from the div
      div.remove() // this will removes entire div 
    }

    

    function changeText(){
      x.innerHTML="RAMESH";
      x.style.backgroundColor="green"
      x.style.color="white"

    }

    function addContent(){
     let x= document.createElement("h2");
     x.innerHTML="WELCOME TO DOM";
     div.append(x)
    }

  
  </script>

  
</body>
</html>

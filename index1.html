<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function evenOrOdd(x) {
        if (x % 2 == 0) {
          // console.log("it is even")
          return "it is even";
        } else {
          return "it is odd";
        }
      }

      let ip = prompt("enter ip:");
      console.log(evenOrOdd(ip));
    </script>
  </body>

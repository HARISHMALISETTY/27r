<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        :root{
            --sm:120px;
            --md:250px;
            --lg:350px;
            --xl:450px;
            --primary:orange;
            --bgprimary:blue;
            --bgsecondary:grey;
            --bgdanger:red;
            --bgwarning:yellow;
        }

        h1{
            color: var(--primary);
            height: var(--sm);
            background-color: var(--bgsecondary);
            width: var(--md);
        }
        h2{
            color: var(--primary);
        }
        p{
            background-color: var(--primary);
            color: var(--bgdanger);
        }
        /* a{
            text-decoration: none;
        } */
        a:link{
            background-color: green;
        }
        a:hover{
            text-decoration: none;
            color: white;
            background-color: black;
        }

        a:visited{
            color: red;
        }
        a:active{
            color: green;
            background-color: white;
        }

        .ip1:focus{
            background-color: orange;
            box-shadow: 2px 2px red;
            /* border: 13px solid red; */
        }

        .ip1:hover{
            background-color: pink;
        }

        .ip2:focus{
            background-color: green;
            border:3px solid yellow;
        }
    </style>
</head>
<body>


    <h1>helloo</h1>
    <h2>welcome</h2>
    <a href="./base.html">click here</a>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae nihil earum ipsam unde, quisquam rerum, a similique, aperiam ratione aliquid eaque! Expedita assumenda dicta aspernatur ratione voluptas consectetur animi amet.</p>
    
    <form>
        <input type="text" class="ip1">
        <input type="text" class="ip2">
    </form>


    
</body>
</html>
